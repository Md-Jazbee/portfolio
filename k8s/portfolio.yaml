apiVersion: apps/v1
kind: Deployment
metadata:
  name: jasbeer-portfolio
  labels:
    app: jasbeer-portfolio
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jasbeer-portfolio
  template:
    metadata:
      labels:
        app: jasbeer-portfolio
    spec:
      containers:
        - name: web
          image: ghcr.io/your-org/jasbeer-portfolio:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: jasbeer-portfolio
  labels:
    app: jasbeer-portfolio
spec:
  type: ClusterIP
  selector:
    app: jasbeer-portfolio
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: http
